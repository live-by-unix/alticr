[package]
name = "alticr"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "ALTICR - a fast, open-source desktop terminal emulator"
license = "BSD-3-Clause"
authors = ["live-by-unix"]

[lib]
name = "alticr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
vt100 = "0.15"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
unicode-width = "0.2"
shell-words = "1"
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
